[tool.codespell]
enable-colors = true
write-changes = true
check-hidden = true
quiet-level = 3
builtin = ["clear", "rare", "en-GB_to_en-US"]
skip = [
	".mailmap",
	"*.gitignore",
	"AUTHORS.md",
]

[tool.pytest.ini_options]
# hacktools (assembler, emulator, build helper) lives in the DevelopmentTools repo
# and is installed with pip; see CONTRIBUTING.md.
testpaths = ["hw/sim/tests"]
pythonpath = ["hw/sim"]
markers = [
	"requires_iverilog: skip when iverilog is not on PATH",
	"requires_yosys: skip when yosys is not on PATH",
	"requires_env(*names): skip when any of these environment variables is unset",
]
