[tool.codespell]
enable-colors = true
write-changes = true
check-hidden = true
quiet-level = 3
builtin = ["clear", "rare", "en-GB_to_en-US"]
skip = [
	".mailmap",
	"*.gitignore",
	"AUTHORS.md",
]

[tool.pytest.ini_options]
testpaths = ["tools/hacktools/tests", "hw/sim/tests"]
pythonpath = ["tools/hacktools/src", "hw/sim"]
markers = [
	"requires_iverilog: skip when iverilog is not on PATH",
	"requires_yosys: skip when yosys is not on PATH",
	"requires_env(*names): skip when any of these environment variables is unset",
]
