[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacktools"
version = "0.1.0"
description = "Dev tooling for HackGateware: bitstream builds, Hack assembler, emulator, flashing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hacktools = "hacktools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
