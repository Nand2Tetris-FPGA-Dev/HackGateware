[spike_blinky]
top = "top"
sources = ["hw/spikes/blinky/top.v"]
cst = ["hw/boards/tangnano9k/base.cst"]

[spike_hdmi_bars]
top = "top"
sources = [
  "hw/spikes/hdmi_bars/top.v",
  "hw/rtl/video/clocks_gowin.v",
  "hw/rtl/video/video_timing_640x480.v",
  "hw/rtl/video/tmds_encoder.v",
  "hw/rtl/video/hdmi_phy_gowin.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/hdmi.cst"]

[mvp]
top = "top"
rom_words = 2048
sources = [
  "hw/rtl/top/top_tangnano9k_mvp.v",
  "hw/rtl/top/hack_computer.v",
  "hw/rtl/top/reset_sync.v",
  "hw/rtl/cpu/hack_cpu.v",
  "hw/rtl/cpu/hack_alu.v",
  "hw/rtl/mem/hack_memory.v",
  "hw/rtl/mem/ram16k.v",
  "hw/rtl/mem/screen_mem.v",
  "hw/rtl/progmem/progmem_rom.v",
  "hw/rtl/video/clocks_gowin.v",
  "hw/rtl/video/video_timing_640x480.v",
  "hw/rtl/video/hack_fb_reader.v",
  "hw/rtl/video/tmds_encoder.v",
  "hw/rtl/video/hdmi_phy_gowin.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/hdmi.cst"]

[spike_flash]
top = "top"
sources = [
  "hw/spikes/flash_read/top.v",
  "hw/rtl/io/spi_flash_reader.v",
  "hw/rtl/top/reset_sync.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/flash.cst"]
pack_flags = ["--mspi_as_gpio"]

# Task 12 gate passed on the board: PROGMEM = psram, read latency 35 cycles
[spike_psram]
top = "top"
sources = [
  "hw/spikes/psram_test/top.v",
  "hw/rtl/mem/psram_ctrl.v",
  "hw/rtl/top/reset_sync.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/psram.cst"]

[hdmi]
top = "top"
sources = [
  "hw/rtl/top/top_tangnano9k_hdmi.v",
  "hw/rtl/top/flash_boot_system.v",
  "hw/rtl/top/hack_computer.v",
  "hw/rtl/top/reset_sync.v",
  "hw/rtl/cpu/hack_cpu.v",
  "hw/rtl/cpu/hack_alu.v",
  "hw/rtl/io/boot_loader.v",
  "hw/rtl/debug/hack_stats.v",
  "hw/rtl/debug/debug_screen.v",
  "hw/rtl/debug/st7789_driver.v",
  "hw/rtl/io/spi_flash_reader.v",
  "hw/rtl/io/uart_rx.v",
  "hw/rtl/io/uart_tx.v",
  "hw/rtl/io/frame_rx.v",
  "hw/rtl/io/frame_tx.v",
  "hw/rtl/io/serial_link.v",
  "hw/rtl/mem/hack_memory.v",
  "hw/rtl/mem/ram16k.v",
  "hw/rtl/mem/screen_mem.v",
  "hw/rtl/mem/psram_ctrl.v",
  "hw/rtl/progmem/progmem_psram.v",
  "hw/rtl/video/clocks_gowin.v",
  "hw/rtl/video/video_timing_640x480.v",
  "hw/rtl/video/hack_fb_reader.v",
  "hw/rtl/video/tmds_encoder.v",
  "hw/rtl/video/hdmi_phy_gowin.v",
]
cst = [
  "hw/boards/tangnano9k/base.cst",
  "hw/boards/tangnano9k/hdmi.cst",
  "hw/boards/tangnano9k/psram.cst",
  "hw/boards/tangnano9k/flash.cst",
  "hw/boards/tangnano9k/lcd.cst",
  "hw/boards/tangnano9k/uart.cst",
]
pack_flags = ["--mspi_as_gpio"]

[spike_lcd]
top = "top"
sources = [
  "hw/spikes/lcd_bars/top.v",
  "hw/rtl/debug/st7789_driver.v",
  "hw/rtl/top/reset_sync.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/lcd.cst"]

[spike_uart]
top = "top"
sources = [
  "hw/spikes/uart_echo/top.v",
  "hw/rtl/io/uart_rx.v",
  "hw/rtl/io/uart_tx.v",
  "hw/rtl/top/reset_sync.v",
]
cst = ["hw/boards/tangnano9k/base.cst", "hw/boards/tangnano9k/uart.cst"]
